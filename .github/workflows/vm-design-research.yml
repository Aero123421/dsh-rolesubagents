# Temporary research runner; removed from final design diff after recording results.
name: VM design research
on:
  push:
    branches: [docs/vm-execution-kiss-design]
    paths: [.github/workflows/vm-design-research.yml]
permissions:
  contents: read
jobs:
  installed-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Install pinned DSH in disposable runner directory
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package=npm@10.9.2 npm install --prefix "$RUNNER_TEMP/dsh-vm-runtime" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2 pnpm@10.28.0 playwright@1.56.1
          echo "$RUNNER_TEMP/dsh-vm-runtime/node_modules/.bin" >> "$GITHUB_PATH"
          echo "DSH_CHECKOUT=$RUNNER_TEMP/dsh-vm-runtime/node_modules/@deepseek-ai/dsh" >> "$GITHUB_ENV"
          echo "DSH_HOME=$RUNNER_TEMP/dsh-vm-home" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/dsh-vm-runtime/node_modules/.bin/dsh" --version
      - name: Install plugin and check installed DSH contracts
        run: |
          pnpm install --frozen-lockfile
          node scripts/check-workflow-host.mjs
          pnpm pack --pack-destination "$RUNNER_TEMP"
          dsh plugin --profile web add "$RUNNER_TEMP/dsh-rolesubagents-0.2.1.tgz"
          dsh --profile web --dump-config > "$RUNNER_TEMP/dsh-composed.yml"
          grep -q rolesubagents "$RUNNER_TEMP/dsh-composed.yml"
          echo 'PASS real profile composition includes rolesubagents'
          playwright install chromium
      - name: Boot real Web and exercise authenticated browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-web-workspace"
          cd "$RUNNER_TEMP/dsh-web-workspace"
          dsh web --no-open --host 127.0.0.1 --port 19873 > "$RUNNER_TEMP/dsh-web.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          cat > "$RUNNER_TEMP/dsh-vm-runtime/browser-check.mjs" <<'JS'
          import {readFileSync} from 'node:fs';
          import {chromium} from 'playwright';
          let url;
          for (let i=0;i<60;i++) {
            const text=readFileSync(process.env.RUNNER_TEMP+'/dsh-web.log','utf8');
            url=/^dsh web: (http:\/\/127\.0\.0\.1:\d+\/\S*)/m.exec(text)?.[1];
            if(url) break;
            await new Promise(r=>setTimeout(r,1000));
          }
          if(!url) throw new Error('No loopback ready URL; credentials intentionally not printed');
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.name));
            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response || response.status()!==200) throw new Error('Authenticated frontend did not return HTTP 200');
            await page.waitForTimeout(3000);
            const text=await page.locator('body').innerText();
            if(text.trim().length<20) throw new Error('Frontend did not render');
            console.log('PASS authenticated DSH Web HTTP 200 and non-empty rendered DOM');
            console.log('DSH_BROWSER_PAGEERROR_COUNT',errors.length);
            console.log('DSH_BROWSER_NAV_LABELS',JSON.stringify((await page.getByRole('button').allTextContents()).map(x=>x.trim()).filter(x=>x.length>0&&x.length<70).slice(0,25)));
            const pluginNav=page.getByRole('button',{name:/^Plugins$|^插件$/}).first();
            if(await pluginNav.count()) {
              await pluginNav.click();
              await page.waitForTimeout(1500);
              console.log('PLUGIN_PAGE_CONTAINS_TARGET', (await page.locator('body').innerText()).includes('dsh-rolesubagents'));
            } else console.log('PLUGIN_NAV_NOT_MATCHED: configuration interactions not claimed');
          } finally {await browser.close();}
          JS
          node "$RUNNER_TEMP/dsh-vm-runtime/browser-check.mjs"
      - name: Install Lima and validate no-mount configuration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-lima-bin"
          curl --fail --location --retry 2 --max-time 120 https://github.com/lima-vm/lima/releases/download/v2.2.1/lima-2.2.1-Linux-x86_64.tar.gz -o "$RUNNER_TEMP/lima.tar.gz"
          echo "b391ac7fcac2b2a5a1628107756463188ded4d18d3104a40a66a8bb6fec01bcb  $RUNNER_TEMP/lima.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/lima.tar.gz" -C "$RUNNER_TEMP/dsh-lima-bin"
          export LIMA_HOME="$RUNNER_TEMP/dsh-lima-home"
          export PATH="$RUNNER_TEMP/dsh-lima-bin/bin:$PATH"
          limactl --version
          limactl list --json
          limactl template copy --fill template:default "$RUNNER_TEMP/dsh-vm.yaml"
          limactl template yq "$RUNNER_TEMP/dsh-vm.yaml" '.mounts = [] | .containerd.system = false | .containerd.user = false | .ssh.forwardAgent = false | .ssh.loadDotSSHPubKeys = false | .ssh.forwardX11 = false | .ssh.forwardX11Trusted = false | .portForwards = [{"guestPortRange": [1, 65535], "ignore": true}]' > "$RUNNER_TEMP/dsh-vm-isolated.yaml"
          limactl validate "$RUNNER_TEMP/dsh-vm-isolated.yaml"
          if test -r /dev/kvm && test -w /dev/kvm; then echo 'KVM_ACCESSIBLE'; else echo 'KVM_UNAVAILABLE: no accelerated VM E2E claimed'; fi
