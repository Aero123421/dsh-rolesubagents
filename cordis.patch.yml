# dsh-rolesubagents bundle layer.
#
# Inserts one row. Its Host half (lib/index.js) installs the role-aware
# `delegate` tool in each Agent's own scope, records each child's role in the
# storage domain, and contributes the role instructions as runtime
# context. Its browser half (lib/client.js, declared under `dsh.client` in
# package.json) adds the role editor to this bundle's page under Plugins.
# A role can instead run its child once on an external coding-agent CLI
# installed on the Host (Codex CLI, Claude Code, Antigravity CLI, OpenCode,
# Grok Build, Pi).
#
# Roles are edited from the Plugins page and stored as this row's settings.
# Saves apply to new root Sessions; existing Sessions and their children/forks
# retain their catalog. Opt-in manage_roles apply_current explicitly refreshes
# only the calling parent's future delegation catalog, never existing children.
#
# Turn off the official `subagent` / `subagent_fork` tools so the model sees
# one delegation tool. If they stay on, both kinds of tools coexist: this
# plugin uses its own tool name so it never collides with them.
- insert:
    - id: rolesubagents
      name: dsh-rolesubagents
